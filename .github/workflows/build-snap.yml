name: Build Snap package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # get full history (needed for tags)
          fetch-tags: true     # ensure tags are fetched

      - name: Build the snap
        uses: snapcore/action-build@v1
        id: build

      - name: Test the built snap
        env:
          SNAP_PATH: ${{ steps.build.outputs.snap }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          sudo snap install --dangerous "$SNAP_PATH"
          PUNCH_TEST_BROWSER=1 xvfb-run -a scripts/test_all_cli_options.sh /snap/bin/punch
          PUNCH_TEST_BROWSER=1 PUNCH_TEST_BROWSER_CHOICE=2 xvfb-run -a scripts/test_all_cli_options.sh /snap/bin/punch
          PUNCH_TEST_BROWSER=1 PUNCH_TEST_BROWSER_CHOICE=3 xvfb-run -a scripts/test_all_cli_options.sh /snap/bin/punch

      - name: Test Snap WebKit over HTTPS
        run: |
          # Exercises WebKit's TLS stack against a real CA-signed site. Skip
          # rather than fail when the external site is unreachable.
          url=https://example.com/
          if ! curl -fsS --max-time 20 --retry 3 --retry-all-errors -o /dev/null "$url"; then
            echo "::warning::$url is unreachable; skipping the WebKit HTTPS check."
            exit 0
          fi
          PUNCH_TEST_BROWSER=1 PUNCH_TEST_BROWSER_CHOICE=3 PUNCH_TEST_BROWSER_URL="$url" xvfb-run -a scripts/test_all_cli_options.sh /snap/bin/punch

      - uses: snapcore/action-publish@v1
        if: github.event_name == 'push'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: edge
      
      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.architecture }}
          path: ${{ steps.build.outputs.snap }}
