name: punch
base: core24
# version: '0.3.3'
summary: CLI tool for tracking, reporting, and submitting your work tasks and timecards
description: |
  Punch is a command-line tool for tracking, reporting, and submitting your work tasks and timecards.
  It supports quick task entry, interactive mode, reporting, exporting, and Salesforce Lightning timecard submission.

grade: stable
confinement: strict

icon: snap/gui/icon.svg

apps:
  punch:
    command: bin/punch
    command-chain:
      - bin/punch-env
    completer: bin/punch-completer
    plugs:
      - home
      - network
      - network-bind
      - browser-support
      - x11
      - wayland
      - u2f-devices
    environment:
      PLAYWRIGHT_BROWSERS_PATH: $SNAP_USER_COMMON/playwright-browsers
      XKB_CONFIG_ROOT: $SNAP/usr/share/X11/xkb
      GIO_EXTRA_MODULES: $SNAP/usr/lib/punch-gio-modules

adopt-info: punch

parts:
  punch:
    plugin: python
    source: .
    build-packages:
      - git
      - python3-dev
      - python3-pip
      - python3-venv
      - gcc
      - libffi-dev
      - libssl-dev
      - libglib2.0-bin
      - shared-mime-info
    stage-packages:
      - glib-networking
      - gsettings-desktop-schemas
      - gstreamer1.0-libav
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - libavif16
      - libenchant-2-2
      - libgraphene-1.0-0
      - libgstreamer-gl1.0-0
      - libgstreamer-plugins-bad1.0-0
      - libgstreamer-plugins-base1.0-0
      - libgstreamer1.0-0
      - libgtk-4-1
      - libharfbuzz-icu0
      - libhyphen0
      - libmanette-0.2-0
      - libnghttp2-14
      - libopus0
      - libpsl5t64
      - libvulkan1
      - libwayland-server0
      - libwebpdemux2
      - libwebpmux3
      - libxslt1.1
      - shared-mime-info
      - xkb-data
      - libnss3
      - libatomic1
      - libatk1.0-0
      - libatk-bridge2.0-0
      - libcups2
      - libdrm2
      - libgbm1
      - libgtk-3-0
      - libxcomposite1
      - libxdamage1
      - libxrandr2
      - libasound2t64
      - libxss1
      - libxtst6
      - libappindicator3-1
      - libnspr4
      - libnss3
      - libx11-xcb1
      - libxshmfence1
      - libxcb-dri3-0
      - libxkbcommon0
      - libxrender1
      - libxext6
      - libxfixes3
      - libxinerama1
      - libxcomposite1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libxss1
      - libxtst6
      - libappindicator3-1
      - libdbusmenu-glib4
      - libdbusmenu-gtk3-4
      - libsecret-1-0
      - libgtk-3-0
      - libnotify4
      - libnss3
      - libx11-xcb1
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxrandr2
      - libgbm1
      - libasound2t64
      - libatk-bridge2.0-0
      - libgtk-3-0
      - libxkbcommon0
      - libxshmfence1
      - libnspr4
      - libdrm2
      - libxcb-dri3-0
      - libcups2
      - libxinerama1
      - libxcursor1
      - libxi6
      - libappindicator3-1
      - libdbusmenu-glib4
      - libdbusmenu-gtk3-4
      - libsecret-1-0
      - libnotify4
    override-pull: |
      craftctl default
      if tag=$(git describe --tags --exact-match 2>/dev/null); then
        version="${tag#v}"
      else
        latest_tag=$(git describe --tags --abbrev=0)
        latest_tag="${latest_tag#v}"
        ts=$(date -u -d "@$(git log -1 --format=%ct)" +%y%m%d%H%M%S)
        hash=$(git rev-parse --short HEAD)
        version="${latest_tag}+${ts}.${hash}"
      fi
      craftctl set version="$version"
    override-build: |
      craftctl default
      update-mime-database "$CRAFT_PART_INSTALL/usr/share/mime"
      glib-compile-schemas --strict "$CRAFT_PART_INSTALL/usr/share/glib-2.0/schemas"
      ln -s "$CRAFT_ARCH_TRIPLET_BUILD_FOR/gio/modules" \
        "$CRAFT_PART_INSTALL/usr/lib/punch-gio-modules"
      ln -s "libproxy/libpxbackend-1.0.so" \
        "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libpxbackend-1.0.so"
      install -m755 snap/punch-env "$CRAFT_PART_INSTALL/bin/punch-env"
      install -m755 punch-completion.bash $SNAPCRAFT_PART_INSTALL/bin/punch-completer
      install -D -m644 "$CRAFT_PART_SRC/CHANGELOG.md" \
        "$CRAFT_PART_INSTALL/usr/share/punch/CHANGELOG.md"

# Notes:
# - This snap uses Poetry for dependency management and builds the wheel.
# - Playwright browser binaries are downloaded to SNAP_USER_COMMON on first login or submit.
